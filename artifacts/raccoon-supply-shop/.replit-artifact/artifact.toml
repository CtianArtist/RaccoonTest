kind = "web"
previewPath = "/"
title = "Raccoon Supply Co."
description = "The existing Raccoon Supply Co. storefront, expanded with sandbox checkout, secure customer accounts, orders, returns and its preserved community and Zendesk support widget."
version = "1.0.0"
id = "artifacts/raccoon-supply-shop"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22929

[services.development]
run = "pnpm --filter @workspace/raccoon-supply-shop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/raccoon-supply-shop", "run", "build" ]
serve = "static"
publicDir = "artifacts/raccoon-supply-shop/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22929"
BASE_PATH = "/"
